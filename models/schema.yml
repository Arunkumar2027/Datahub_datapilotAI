version: 2

sources:
  - name: raw
    database: raw
    tables:
      - name: customer_transactions
        description: "Raw customer transaction events"
        columns:
          - name: transaction_id
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "PII - Customer identifier"
          - name: amount
            tests:
              - not_null
          - name: currency
            tests:
              - not_null

models:
  - name: stg_customer_transactions
    description: "Staging model for customer transactions with PII masked"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: hashed_customer_id
        tests:
          - not_null

  - name: customer_revenue
    description: "Daily customer revenue aggregation"
    columns:
      - name: transaction_date
        tests:
          - not_null
      - name: hashed_customer_id
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: daily_revenue
        tests:
          - not_null