version: 2

sources:
  - name: raw
    tables:
      - name: customer_transactions
        description: "Raw customer transaction events, joined from payment gateway data."

models:
  - name: stg_customer_transactions
    description: "Staging model for customer transactions with PII masking applied."
    columns:
      - name: transaction_id
        description: "Unique transaction identifier"
        tests:
          - unique
          - not_null
      - name: hashed_customer_id
        description: "MD5 hashed customer identifier for PII protection"
        tests:
          - not_null
      - name: amount
        description: "Transaction amount"
        tests:
          - not_null

  - name: customer_revenue
    description: "Daily aggregated customer revenue model."
    columns:
      - name: transaction_date
        description: "The day the transactions occurred"
        tests:
          - not_null
      - name: hashed_customer_id
        description: "MD5 hashed customer identifier"
        tests:
          - not_null
      - name: daily_revenue
        description: "Total revenue generated by the customer on this day"
        tests:
          - not_null