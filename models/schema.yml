version: 2

sources:
  - name: raw
    database: raw
    tables:
      - name: customer_transactions
        description: "Raw customer transaction events"
        columns:
          - name: transaction_id
            tests:
              - unique
              - not_null
          - name: customer_id
            tests:
              - not_null
          - name: amount
            tests:
              - not_null
          - name: currency
            tests:
              - not_null

models:
  - name: stg_customer_transactions
    description: "Staged customer transactions with PII masked"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "MD5 hashed customer identifier to protect PII"
        tests:
          - not_null
      - name: amount
        tests:
          - not_null

  - name: customer_revenue
    description: "Daily aggregated customer revenue"
    columns:
      - name: revenue_id
        tests:
          - unique
          - not_null
      - name: revenue_date
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: daily_revenue
        tests:
          - not_null